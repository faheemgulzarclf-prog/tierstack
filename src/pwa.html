<div class="pwa-bar" id="pwaBar" hidden><span class="pwa-ic" aria-hidden="true"></span><div><b>Get the TierStack app</b><small id="pwaTxt">Opens like an app from your home screen. Works offline.</small></div><button type="button" class="btn gold sm" id="pwaGo">Install</button><button type="button" class="pwa-x" id="pwaX" aria-label="Close">×</button></div>
<style>
.pwa-bar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:460px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pwaIn .5s cubic-bezier(.2,.8,.2,1)}
.pwa-bar[hidden]{display:none}.pwa-bar>div{flex:1;min-width:0}.pwa-bar b{display:block;font-size:14px}.pwa-bar small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.pwa-ic{width:40px;height:40px;border-radius:10px;flex:none;background:url(icons/icon-192.png) center/cover}
.pwa-x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px}
@keyframes pwaIn{from{transform:translateY(30px);opacity:0}}
@media (min-width:900px){.pwa-bar{bottom:24px}}
</style>
<script>(function(){
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(function(){});
var bar=document.getElementById("pwaBar"),go=document.getElementById("pwaGo"),txt=document.getElementById("pwaTxt"),ev=null;
var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function seen(){try{return localStorage.getItem("ts-pwa-x")==="1"}catch(e){return false}}
function hide(){bar.hidden=true;try{localStorage.setItem("ts-pwa-x","1")}catch(e){}}
document.getElementById("pwaX").onclick=hide;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;if(!standalone&&!seen())setTimeout(function(){bar.hidden=false},4000);});
go.onclick=function(){if(ev){ev.prompt();ev.userChoice.then(function(){bar.hidden=true;ev=null;});}else hide();};
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
if(ios&&!standalone&&!seen()){txt.textContent="Tap Share, then \u201cAdd to Home Screen\u201d.";go.textContent="Got it";setTimeout(function(){bar.hidden=false},4000);}
window.addEventListener("appinstalled",function(){bar.hidden=true;});
})();</script>
